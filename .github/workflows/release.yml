name: Release

# Push a tag like v0.1.0 to build the app, run the tests and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test EcoKoin.sln --configuration Release

      - name: Publish WPF app
        run: >
          dotnet publish src/EcoKoin.WPF/EcoKoin.WPF.csproj
          --configuration Release --runtime win-x64 --self-contained false
          --output publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "EcoKoin-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          "EcoKoin-${{ github.ref_name }}-win-x64.zip"
          --title "EcoKoin ${{ github.ref_name }}"
          --generate-notes
