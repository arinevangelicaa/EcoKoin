name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core build and tests
    runs-on: ubuntu-latest
    services:
      # Ephemeral PostgreSQL for the repository contract tests. The password is a throwaway
      # value that only exists for the lifetime of this job; it is not a real credential.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ecokoin
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: ecokoin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecokoin -d ecokoin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EcoKoin.sln

      - name: Build
        run: dotnet build EcoKoin.sln --configuration Release --no-restore

      - name: Test
        env:
          ECOKOIN_TEST_PG_CONNECTION: Host=localhost;Port=5432;Database=ecokoin_test;Username=ecokoin;Password=ci-throwaway-password
        run: >
          dotnet test EcoKoin.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  wpf:
    name: WPF build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build WPF app
        run: dotnet build src/EcoKoin.WPF/EcoKoin.WPF.csproj --configuration Release
